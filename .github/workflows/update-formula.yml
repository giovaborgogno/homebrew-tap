name: Update formula

# Manually regenerate Formula/gandr.rb from a gandr release.
# Run it from the Actions tab (or: gh workflow run "Update formula" -f tag=v0.2.0).
# Leave `tag` empty to pick up the latest release automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "gandr release tag (e.g. v0.2.0). Empty = latest release."
        required: false
        default: ""

permissions:
  contents: write

env:
  REPO: giovaborgogno/gandr

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          fi
          echo "Using tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compute source sha256
        id: sha
        run: |
          url="https://github.com/${REPO}/archive/refs/tags/${{ steps.tag.outputs.tag }}.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Write Formula/gandr.rb
        run: |
          mkdir -p Formula
          cat > Formula/gandr.rb <<RB
          # Auto-generated by .github/workflows/update-formula.yml — do not edit by hand.
          # Regenerate with: gh workflow run "Update formula" -f tag=${{ steps.tag.outputs.tag }}
          class Gandr < Formula
            desc "Read-only TUI to review code changes and browse your repo"
            homepage "https://github.com/${REPO}"
            url "${{ steps.sha.outputs.url }}"
            sha256 "${{ steps.sha.outputs.sha }}"
            license "MIT"
            head "https://github.com/${REPO}.git", branch: "main"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              # gandr is an interactive TUI (no --help/--version flag), so just verify
              # the binary installed and is executable.
              assert_predicate bin/"gandr", :executable?
            end
          end
          RB

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/gandr.rb; then
            echo "Formula already up to date for ${{ steps.tag.outputs.tag }} — nothing to commit."
            exit 0
          fi
          git add Formula/gandr.rb
          git commit -m "gandr ${{ steps.tag.outputs.tag }}"
          git push
